<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bitcoin Blake | BTCB2 / USDC</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      background: #0b0b0b;
      color: #f7931a;
      font-family: Arial, Helvetica, sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
    }

    .logo {
      width: 58px;
      height: 58px;
      margin: 0 auto 18px;

      background: #f7931a;
      color: #0b0b0b;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 34px;
      font-weight: bold;
    }

    .brand {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .pair {
      color: #999;
      font-size: 15px;
      letter-spacing: 2px;
      margin-bottom: 14px;
    }

    #price {
      font-size: 64px;
      font-weight: 600;
      letter-spacing: -2px;
    }

    .source {
      margin-top: 14px;
      color: #555;
      font-size: 11px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">₿</div>

    <div class="brand">Bitcoin Blake</div>

    <div class="pair">BTCB2 / USDC</div>

    <div id="price">Loading...</div>

    <div class="source">LIVE PRICE · NEOXA</div>

  </div>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

  <script>
    const socket = io("https://neoxa.exchange/exchange", {
      transports: ["websocket", "polling"],
      withCredentials: true,
      reconnection: true
    });

    socket.on("connect", () => {
      console.log("Connected to Neoxa");

      socket.emit("subscribe", {
        pair: "BTCB2_USDC"
      });
    });

    socket.on("exchange:trades", (data) => {
      if (!data) return;
      if (data.pair !== "BTCB2_USDC") return;
      if (!Array.isArray(data.trades)) return;
      if (data.trades.length === 0) return;

      const price = Number(data.trades[0].price);

      if (!Number.isFinite(price) || price <= 0) return;

      document.getElementById("price").textContent =
        "$" + price.toFixed(8);
    });

    socket.on("disconnect", () => {
      document.getElementById("price").textContent = "Disconnected";
    });
  </script>

</body>
</html>
